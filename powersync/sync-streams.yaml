        FROM spike_items
        JOIN spike_account_memberships AS membership ON membership.account_id = spike_items.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE spike_items.account_id = subscription.parameter('account_id')
        AND principal.auth_user_id = auth.user_id()
        AND membership.state = 'active'
      - |
