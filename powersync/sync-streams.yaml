          spike_item_placements.started_by_principal_id, spike_item_placements.ended_at, spike_item_placements.ended_by_principal_id
        FROM spike_item_placements
        JOIN spike_account_memberships AS membership ON membership.account_id = spike_item_placements.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE spike_item_placements.account_id = subscription.parameter('account_id')
