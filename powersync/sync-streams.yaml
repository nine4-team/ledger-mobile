config:
  edition: 3

streams:
  item_images:
    queries:
      - |
        SELECT item_image_sets.id,item_image_sets.account_id,item_image_sets.item_id,
          item_image_sets.revision::text AS revision,item_image_sets.expected_count
        FROM item_image_sets
        JOIN spike_account_memberships AS membership ON membership.account_id=item_image_sets.account_id
        JOIN spike_principals AS principal ON principal.id=membership.principal_id
        WHERE item_image_sets.account_id=subscription.parameter('account_id')
        AND item_image_sets.item_id=subscription.parameter('item_id')
        AND membership.state='active' AND principal.auth_user_id=auth.user_id()
      - |
        SELECT item_image_references.id,item_image_references.account_id,item_image_references.item_id,
          item_image_references.attachment_id,item_image_references.set_revision::text AS set_revision,
          item_image_references.position,item_image_references.is_primary
        FROM item_image_references
        JOIN item_image_sets AS image_set ON image_set.account_id=item_image_references.account_id
          AND image_set.item_id=item_image_references.item_id AND image_set.revision=item_image_references.set_revision
        JOIN spike_account_memberships AS membership ON membership.account_id=item_image_references.account_id
        JOIN spike_principals AS principal ON principal.id=membership.principal_id
        WHERE item_image_references.account_id=subscription.parameter('account_id')
        AND item_image_references.item_id=subscription.parameter('item_id')
        AND image_set.account_id=subscription.parameter('account_id')
        AND image_set.item_id=subscription.parameter('item_id')
        AND membership.state='active' AND principal.auth_user_id=auth.user_id()
      - |
        SELECT item_image_objects.id,item_image_objects.account_id,item_image_objects.content_sha256,
          item_image_objects.byte_count::text AS byte_count,item_image_objects.media_type,item_image_objects.storage_path
        FROM item_image_objects
        JOIN spike_account_memberships AS membership ON membership.account_id=item_image_objects.account_id
        JOIN spike_principals AS principal ON principal.id=membership.principal_id
        WHERE item_image_objects.account_id=subscription.parameter('account_id')
        AND item_image_objects.id IN (
          SELECT reference.attachment_id FROM item_image_references AS reference
          JOIN item_image_sets AS image_set ON image_set.account_id=reference.account_id
            AND image_set.item_id=reference.item_id AND image_set.revision=reference.set_revision
          WHERE reference.account_id=subscription.parameter('account_id')
          AND reference.item_id=subscription.parameter('item_id')
          AND image_set.account_id=subscription.parameter('account_id')
          AND image_set.item_id=subscription.parameter('item_id')
        )
        AND membership.state='active' AND principal.auth_user_id=auth.user_id()
      - |
        SELECT item_card_thumbnails.id,item_card_thumbnails.account_id,item_card_thumbnails.original_attachment_id,
          item_card_thumbnails.thumbnail_attachment_id,item_card_thumbnails.recipe,
          item_card_thumbnails.pixel_width,item_card_thumbnails.pixel_height
        FROM item_card_thumbnails
        JOIN spike_account_memberships AS membership ON membership.account_id=item_card_thumbnails.account_id
        JOIN spike_principals AS principal ON principal.id=membership.principal_id
        WHERE item_card_thumbnails.account_id=subscription.parameter('account_id')
        AND item_card_thumbnails.original_attachment_id IN (
          SELECT reference.attachment_id FROM item_image_references AS reference
          JOIN item_image_sets AS image_set ON image_set.account_id=reference.account_id
            AND image_set.item_id=reference.item_id AND image_set.revision=reference.set_revision
          WHERE reference.account_id=subscription.parameter('account_id')
          AND reference.item_id=subscription.parameter('item_id')
          AND image_set.account_id=subscription.parameter('account_id')
          AND image_set.item_id=subscription.parameter('item_id')
        )
        AND membership.state='active' AND principal.auth_user_id=auth.user_id()
      - |
        SELECT item_image_objects.id,item_image_objects.account_id,item_image_objects.content_sha256,
          item_image_objects.byte_count::text AS byte_count,item_image_objects.media_type,item_image_objects.storage_path
        FROM item_image_objects
        JOIN spike_account_memberships AS membership ON membership.account_id=item_image_objects.account_id
        JOIN spike_principals AS principal ON principal.id=membership.principal_id
        WHERE item_image_objects.account_id=subscription.parameter('account_id')
        AND item_image_objects.id IN (
          SELECT thumbnail.thumbnail_attachment_id FROM item_card_thumbnails AS thumbnail
          JOIN item_image_references AS reference ON reference.account_id=thumbnail.account_id
            AND reference.attachment_id=thumbnail.original_attachment_id
          JOIN item_image_sets AS image_set ON image_set.account_id=reference.account_id
            AND image_set.item_id=reference.item_id AND image_set.revision=reference.set_revision
          WHERE reference.account_id=subscription.parameter('account_id')
          AND reference.item_id=subscription.parameter('item_id')
          AND image_set.account_id=subscription.parameter('account_id')
          AND image_set.item_id=subscription.parameter('item_id')
        )
        AND membership.state='active' AND principal.auth_user_id=auth.user_id()
  account_business_profile:
    queries:
      - |
        SELECT spike_accounts.id, spike_accounts.display_name, spike_accounts.created_at
        FROM spike_accounts
        JOIN spike_account_memberships AS membership ON membership.account_id = spike_accounts.id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE spike_accounts.id = subscription.parameter('account_id')
        AND principal.auth_user_id = auth.user_id()
        AND membership.state = 'active'
      - |
        SELECT spike_account_business_profiles.id, spike_account_business_profiles.account_id, spike_account_business_profiles.logo_attachment_id,
          spike_account_business_profiles.logo_content_sha256, spike_account_business_profiles.logo_byte_count::text AS logo_byte_count,
          spike_account_business_profiles.logo_media_type, spike_account_business_profiles.logo_storage_path, spike_account_business_profiles.revision::text AS revision
        FROM spike_account_business_profiles
        JOIN spike_account_memberships AS membership ON membership.account_id = spike_account_business_profiles.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE spike_account_business_profiles.account_id = subscription.parameter('account_id')
        AND principal.auth_user_id = auth.user_id()
        AND membership.state = 'active'

  property_management_report:
    queries:
      - |
        SELECT item_image_sets.id,item_image_sets.account_id,item_image_sets.item_id,
          item_image_sets.revision::text AS revision,item_image_sets.expected_count
        FROM item_image_sets
        JOIN spike_account_memberships AS membership ON membership.account_id=item_image_sets.account_id
        JOIN spike_principals AS principal ON principal.id=membership.principal_id
        WHERE item_image_sets.account_id=subscription.parameter('account_id')
        AND item_image_sets.sync_project_id=subscription.parameter('project_id')
        AND principal.auth_user_id=auth.user_id() AND membership.state='active'
      - |
        SELECT spike_projects.id, spike_projects.account_id, spike_projects.client_id, spike_projects.display_name,
          spike_projects.description, spike_projects.legacy_notes, spike_projects.property_address, spike_projects.lifecycle, spike_projects.revision,
          spike_projects.category_configuration_revision::text AS category_configuration_revision,
          spike_projects.created_at_ms, spike_projects.updated_at_ms, spike_projects.created_by_principal_id
        FROM spike_projects
        JOIN spike_account_memberships AS membership ON membership.account_id = spike_projects.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE spike_projects.account_id = subscription.parameter('account_id')
        AND spike_projects.id = subscription.parameter('project_id')
        AND principal.auth_user_id = auth.user_id()
        AND membership.state = 'active'
      - |
        SELECT spike_spaces.id, spike_spaces.account_id, spike_spaces.scope_kind, spike_spaces.project_id,
          spike_spaces.display_name, spike_spaces.lifecycle, spike_spaces.revision
        FROM spike_spaces
        JOIN spike_account_memberships AS membership ON membership.account_id = spike_spaces.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE spike_spaces.account_id = subscription.parameter('account_id')
        AND spike_spaces.project_id = subscription.parameter('project_id')
        AND (spike_spaces.lifecycle = 'active' OR spike_spaces.sync_current_item_count > 0)
        AND principal.auth_user_id = auth.user_id()
        AND membership.state = 'active'
      - |
        SELECT spike_item_placements.id, spike_item_placements.account_id, spike_item_placements.item_id, spike_item_placements.scope_kind,
          spike_item_placements.project_id, spike_item_placements.space_id, spike_item_placements.started_at, spike_item_placements.start_evidence,
          spike_item_placements.started_by_principal_id, spike_item_placements.ended_at, spike_item_placements.ended_by_principal_id
        FROM spike_item_placements
        JOIN spike_account_memberships AS membership ON membership.account_id = spike_item_placements.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE spike_item_placements.account_id = subscription.parameter('account_id')
        AND spike_item_placements.project_id = subscription.parameter('project_id')
        AND spike_item_placements.ended_at IS NULL
        AND principal.auth_user_id = auth.user_id()
        AND membership.state = 'active'
      - |
        SELECT spike_items.id, spike_items.account_id, spike_items.name, spike_items.description, spike_items.sku,
          spike_items.workflow_status, spike_items.bookmark,
          spike_items.source, spike_items.current_source, spike_items.notes,
          spike_items.market_value_minor_units::text AS market_value_minor_units, spike_items.market_value_currency, spike_items.revision,
          spike_items.created_at, spike_items.created_by_principal_id
        FROM spike_items
        JOIN spike_account_memberships AS membership ON membership.account_id = spike_items.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE spike_items.account_id = subscription.parameter('account_id')
        AND spike_items.sync_project_id = subscription.parameter('project_id')
        AND principal.auth_user_id = auth.user_id()
        AND membership.state = 'active'

      - |
        SELECT spike_clients.id, spike_clients.account_id, spike_clients.display_name, spike_clients.lifecycle, spike_clients.revision,
          spike_clients.created_at_ms, spike_clients.updated_at_ms,
          spike_clients.created_by_principal_id
        FROM spike_clients
        JOIN spike_projects AS project ON project.account_id = spike_clients.account_id AND project.client_id = spike_clients.id
        JOIN spike_account_memberships AS membership ON membership.account_id = spike_clients.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE spike_clients.account_id = subscription.parameter('account_id')
        AND project.id = subscription.parameter('project_id')
        AND principal.auth_user_id = auth.user_id()
        AND membership.state = 'active'

      - |
        SELECT spike_transactions.id, spike_transactions.account_id, spike_transactions.project_id,
               spike_transactions.client_id, spike_transactions.type, spike_transactions.role,
               spike_transactions.amount_minor_units::text AS amount_minor_units,
               spike_transactions.currency, spike_transactions.origin, spike_transactions.scope_kind,
               spike_transactions.source, spike_transactions.transaction_date::text AS transaction_date,
               spike_transactions.created_at_ms::text AS created_at_ms, spike_transactions.notes,
               spike_transactions.payment_method, spike_transactions.has_email_receipt,
               spike_transactions.legacy_subtotal_minor_units::text AS legacy_subtotal_minor_units,
               spike_transactions.legacy_tax_rate_pct::text AS legacy_tax_rate_pct
        FROM spike_transactions
        JOIN spike_account_memberships AS membership ON membership.account_id = spike_transactions.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE spike_transactions.account_id = subscription.parameter('account_id')
          AND spike_transactions.project_id = subscription.parameter('project_id')
          AND spike_transactions.origin = 'firebase_client_payment'
          AND principal.auth_user_id = auth.user_id()
          AND membership.state = 'active' AND membership.financial_access = 'full'
          AND spike_transactions.id IN (
            SELECT link.transaction_id FROM ledger_private.item_client_payment_connections AS link
            WHERE link.account_id = subscription.parameter('account_id')
              AND link.project_id = subscription.parameter('project_id')
              AND link.ended_at IS NULL AND link.sync_is_current = true
          )
      # These generated columns are constant by the canonical composite FK.
      # Logical replication omits their source values; project the exact constants.
      - |
        SELECT item_client_payment_connections.id, item_client_payment_connections.account_id,
          item_client_payment_connections.project_id, item_client_payment_connections.client_id,
          item_client_payment_connections.item_id, item_client_payment_connections.placement_id,
          item_client_payment_connections.transaction_id, 'purchase' AS transaction_type,
          'standalone' AS transaction_role, item_client_payment_connections.ended_at
        FROM ledger_private.item_client_payment_connections
        JOIN spike_account_memberships AS membership ON membership.account_id = item_client_payment_connections.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE item_client_payment_connections.account_id = subscription.parameter('account_id')
        AND item_client_payment_connections.project_id = subscription.parameter('project_id')
        AND item_client_payment_connections.ended_at IS NULL AND item_client_payment_connections.sync_is_current = true
        AND principal.auth_user_id = auth.user_id()
        AND membership.state = 'active' AND membership.financial_access = 'full'

      - |
        SELECT spike_item_project_categories.id, spike_item_project_categories.account_id,
          spike_item_project_categories.project_id, spike_item_project_categories.item_id,
          spike_item_project_categories.category_id, spike_item_project_categories.revision
        FROM spike_item_project_categories
        JOIN spike_budget_categories AS category ON category.account_id = spike_item_project_categories.account_id
          AND category.id = spike_item_project_categories.category_id
        JOIN spike_account_memberships AS membership ON membership.account_id = spike_item_project_categories.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE spike_item_project_categories.account_id = subscription.parameter('account_id')
        AND spike_item_project_categories.project_id = subscription.parameter('project_id')
        AND spike_item_project_categories.sync_is_current = true
        AND principal.auth_user_id = auth.user_id() AND membership.state = 'active'
        AND (category.visibility_class = 'ordinary' OR membership.financial_access = 'full')

      - |
        SELECT spike_budget_categories.id, spike_budget_categories.account_id, spike_budget_categories.display_name,
          spike_budget_categories.kind, spike_budget_categories.lifecycle, spike_budget_categories.is_system,
          spike_budget_categories.excludes_from_overall_budget, spike_budget_categories.visibility_class,
          spike_budget_categories.presentation_order, spike_budget_categories.revision,
          spike_budget_categories.created_at_ms, spike_budget_categories.updated_at_ms
        FROM spike_budget_categories
        JOIN spike_account_memberships AS membership ON membership.account_id = spike_budget_categories.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE spike_budget_categories.account_id = subscription.parameter('account_id')
        AND spike_budget_categories.id IN (
          SELECT assignment.category_id FROM spike_item_project_categories AS assignment
          WHERE assignment.account_id = subscription.parameter('account_id')
          AND assignment.project_id = subscription.parameter('project_id')
          AND assignment.sync_is_current = true
        )
        AND principal.auth_user_id = auth.user_id() AND membership.state = 'active'
        AND (spike_budget_categories.visibility_class = 'ordinary' OR membership.financial_access = 'full')

      - |
        SELECT item_charge_occurrences.id, item_charge_occurrences.account_id, item_charge_occurrences.project_id,
          item_charge_occurrences.item_id, item_charge_occurrences.placement_id, item_charge_occurrences.category_id,
          item_charge_occurrences.amount_minor_units::text AS amount_minor_units, item_charge_occurrences.currency,
          item_charge_occurrences.revision, item_charge_occurrences.withdrawn_at
        FROM ledger_private.item_charge_occurrences
        JOIN spike_account_memberships AS membership ON membership.account_id = item_charge_occurrences.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE item_charge_occurrences.account_id = subscription.parameter('account_id')
        AND item_charge_occurrences.project_id = subscription.parameter('project_id')
        AND item_charge_occurrences.withdrawn_at IS NULL AND item_charge_occurrences.sync_is_current = true
        AND principal.auth_user_id = auth.user_id()
        AND membership.state = 'active' AND membership.financial_access = 'full'

      - |
        SELECT collected_invoice_lines.id, collected_invoice_lines.account_id, collected_invoice_lines.invoice_id,
          collected_invoice_lines.source_kind, collected_invoice_lines.source_id, collected_invoice_lines.item_id,
          collected_invoice_lines.source_revision::text AS source_revision, collected_invoice_lines.category_id,
          collected_invoice_lines.signed_amount_minor_units::text AS signed_amount_minor_units, collected_invoice_lines.currency,
          collected_invoice_lines.line_position, collected_invoice_lines.description,
          collected_invoice_lines.source_snapshot::text AS source_snapshot_json
        FROM ledger_private.collected_invoice_lines
        JOIN spike_account_memberships AS membership ON membership.account_id = collected_invoice_lines.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE collected_invoice_lines.account_id = subscription.parameter('account_id')
        AND collected_invoice_lines.source_kind = 'item' AND collected_invoice_lines.sync_project_id = subscription.parameter('project_id')
        AND collected_invoice_lines.sync_is_current = true
        AND principal.auth_user_id = auth.user_id() AND membership.state = 'active' AND membership.financial_access = 'full'

      - |
        SELECT collected_invoices.id, collected_invoices.account_id, collected_invoices.project_id,
          collected_invoices.client_id, collected_invoices.sealed, collected_invoices.purchase_id,
          collected_invoices.invoice_revision::text AS invoice_revision, collected_invoices.currency,
          collected_invoices.total_minor_units::text AS total_minor_units,
          collected_invoices.display_metadata::text AS display_metadata
        FROM ledger_private.collected_invoices
        JOIN spike_account_memberships AS membership ON membership.account_id = collected_invoices.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE collected_invoices.account_id = subscription.parameter('account_id')
        AND collected_invoices.project_id = subscription.parameter('project_id') AND collected_invoices.sealed = true
        AND collected_invoices.id IN (
          SELECT line.invoice_id FROM ledger_private.collected_invoice_lines AS line
          WHERE line.source_kind = 'item' AND line.account_id = subscription.parameter('account_id')
          AND line.sync_project_id = subscription.parameter('project_id') AND line.sync_is_current = true
        )
        AND principal.auth_user_id = auth.user_id() AND membership.state = 'active' AND membership.financial_access = 'full'

  project_live_invoices:
    auto_subscribe: false
    queries:
      - |
        SELECT live_invoices.id, live_invoices.account_id, live_invoices.project_id,
          live_invoices.name, live_invoices.notes, live_invoices.status, live_invoices.revision::text AS revision
        FROM ledger_private.live_invoices
        JOIN spike_account_memberships AS membership ON membership.account_id = live_invoices.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE live_invoices.account_id = subscription.parameter('account_id')
        AND live_invoices.project_id = subscription.parameter('project_id')
        AND (live_invoices.status = 'created' OR live_invoices.status = 'sent')
        AND principal.auth_user_id = auth.user_id() AND membership.state = 'active' AND membership.financial_access = 'full'
      - |
        SELECT live_invoice_memberships.account_id || '/' || live_invoice_memberships.invoice_id || '/' ||
          live_invoice_memberships.source_kind || '/' || live_invoice_memberships.source_id AS id,
          live_invoice_memberships.account_id, live_invoice_memberships.invoice_id,
          live_invoice_memberships.source_kind, live_invoice_memberships.source_id, live_invoice_memberships.position
        FROM ledger_private.live_invoice_memberships
        JOIN spike_account_memberships AS membership ON membership.account_id = live_invoice_memberships.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE live_invoice_memberships.account_id = subscription.parameter('account_id')
        AND live_invoice_memberships.released_at IS NULL
        AND live_invoice_memberships.invoice_id IN (
          SELECT live_invoices.id FROM ledger_private.live_invoices
          WHERE live_invoices.account_id = subscription.parameter('account_id')
          AND live_invoices.project_id = subscription.parameter('project_id')
          AND (live_invoices.status = 'created' OR live_invoices.status = 'sent'))
        AND principal.auth_user_id = auth.user_id() AND membership.state = 'active' AND membership.financial_access = 'full'
      - |
        SELECT fee_installments.id, fee_installments.account_id, fee_installments.project_id,
          fee_installments.category_id, fee_installments.label, fee_installments.amount_minor_units::text AS amount_minor_units,
          fee_installments.currency, fee_installments.revision::text AS revision, fee_installments.sort_order
        FROM ledger_private.fee_installments
        JOIN spike_account_memberships AS membership ON membership.account_id = fee_installments.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE fee_installments.account_id = subscription.parameter('account_id')
        AND fee_installments.project_id = subscription.parameter('project_id')
        AND principal.auth_user_id = auth.user_id() AND membership.state = 'active' AND membership.financial_access = 'full'

  project_expenses:
    auto_subscribe: false
    queries:
      # Complete frozen contents, not just matching Expense lines: the existing
      # canonical decoder validates whole-Invoice totals and source identities.
      - |
        SELECT collected_invoices.id, collected_invoices.account_id, collected_invoices.project_id,
          collected_invoices.client_id, collected_invoices.sealed, collected_invoices.purchase_id,
          collected_invoices.invoice_revision::text AS invoice_revision, collected_invoices.currency,
          collected_invoices.total_minor_units::text AS total_minor_units,
          collected_invoices.display_metadata::text AS display_metadata
        FROM ledger_private.collected_invoices
        JOIN spike_account_memberships AS membership ON membership.account_id = collected_invoices.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE collected_invoices.account_id = subscription.parameter('account_id')
        AND collected_invoices.project_id = subscription.parameter('project_id') AND collected_invoices.sealed = true
        AND principal.auth_user_id = auth.user_id() AND membership.state = 'active' AND membership.financial_access = 'full'
      - |
        SELECT collected_invoice_lines.id, collected_invoice_lines.account_id, collected_invoice_lines.invoice_id,
          collected_invoice_lines.source_kind, collected_invoice_lines.source_id, collected_invoice_lines.item_id,
          collected_invoice_lines.source_revision::text AS source_revision, collected_invoice_lines.category_id,
          collected_invoice_lines.signed_amount_minor_units::text AS signed_amount_minor_units, collected_invoice_lines.currency,
          collected_invoice_lines.line_position, collected_invoice_lines.description,
          collected_invoice_lines.source_snapshot::text AS source_snapshot_json
        FROM ledger_private.collected_invoice_lines
        JOIN spike_account_memberships AS membership ON membership.account_id = collected_invoice_lines.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE collected_invoice_lines.account_id = subscription.parameter('account_id')
        AND collected_invoice_lines.invoice_id IN (
          SELECT collected_invoices.id FROM ledger_private.collected_invoices
          WHERE collected_invoices.account_id = subscription.parameter('account_id')
          AND collected_invoices.project_id = subscription.parameter('project_id') AND collected_invoices.sealed = true)
        AND principal.auth_user_id = auth.user_id() AND membership.state = 'active' AND membership.financial_access = 'full'
      - |
        SELECT expenses.id, expenses.account_id, expenses.project_id, expenses.category_id,
          expenses.vendor, expenses.expense_date::text AS expense_date,
          expenses.final_amount_minor_units::text AS final_amount_minor_units,
          expenses.currency, expenses.notes, expenses.revision::text AS revision
        FROM ledger_private.expenses
        JOIN spike_account_memberships AS membership ON membership.account_id = expenses.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE expenses.account_id = subscription.parameter('account_id')
        AND expenses.project_id = subscription.parameter('project_id')
        AND principal.auth_user_id = auth.user_id()
        AND membership.state = 'active' AND membership.financial_access = 'full'
      - |
        SELECT expense_receipt_lines.account_id || '/' || expense_receipt_lines.expense_id || '/' || expense_receipt_lines.id AS id,
          expense_receipt_lines.id AS line_id, expense_receipt_lines.account_id, expense_receipt_lines.expense_id,
          expense_receipt_lines.position, expense_receipt_lines.description,
          expense_receipt_lines.magnitude_minor_units::text AS magnitude_minor_units,
          expense_receipt_lines.currency, expense_receipt_lines.effect, expense_receipt_lines.quantity::text AS quantity
        FROM ledger_private.expense_receipt_lines
        JOIN spike_account_memberships AS membership ON membership.account_id = expense_receipt_lines.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE expense_receipt_lines.account_id = subscription.parameter('account_id')
        AND expense_receipt_lines.expense_id IN (
          SELECT expenses.id FROM ledger_private.expenses
          WHERE expenses.account_id = subscription.parameter('account_id')
          AND expenses.project_id = subscription.parameter('project_id'))
        AND principal.auth_user_id = auth.user_id()
        AND membership.state = 'active' AND membership.financial_access = 'full'
      - |
        SELECT expense_receipt_attachments.account_id || '/' || expense_receipt_attachments.expense_id || '/' || expense_receipt_attachments.attachment_id AS id,
          expense_receipt_attachments.account_id, expense_receipt_attachments.expense_id,
          expense_receipt_attachments.attachment_id, expense_receipt_attachments.position
        FROM ledger_private.expense_receipt_attachments
        JOIN spike_account_memberships AS membership ON membership.account_id = expense_receipt_attachments.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE expense_receipt_attachments.account_id = subscription.parameter('account_id')
        AND expense_receipt_attachments.expense_id IN (
          SELECT expenses.id FROM ledger_private.expenses
          WHERE expenses.account_id = subscription.parameter('account_id')
          AND expenses.project_id = subscription.parameter('project_id'))
        AND principal.auth_user_id = auth.user_id()
        AND membership.state = 'active' AND membership.financial_access = 'full'

      - |
        SELECT spike_budget_categories.id, spike_budget_categories.account_id, spike_budget_categories.display_name,
          spike_budget_categories.kind, spike_budget_categories.lifecycle, spike_budget_categories.is_system,
          spike_budget_categories.excludes_from_overall_budget, spike_budget_categories.visibility_class,
          spike_budget_categories.presentation_order, spike_budget_categories.revision,
          spike_budget_categories.created_at_ms, spike_budget_categories.updated_at_ms
        FROM spike_budget_categories
        JOIN spike_account_memberships AS membership ON membership.account_id = spike_budget_categories.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE spike_budget_categories.account_id = subscription.parameter('account_id')
        AND spike_budget_categories.id IN (
          SELECT expenses.category_id FROM ledger_private.expenses
          WHERE expenses.account_id = subscription.parameter('account_id')
          AND expenses.project_id = subscription.parameter('project_id'))
        AND principal.auth_user_id = auth.user_id()
        AND membership.state = 'active' AND membership.financial_access = 'full'

      - |
        SELECT item_image_objects.id, item_image_objects.account_id, item_image_objects.content_sha256,
          item_image_objects.byte_count::text AS byte_count, item_image_objects.media_type, item_image_objects.storage_path
        FROM item_image_objects
        JOIN spike_account_memberships AS membership ON membership.account_id=item_image_objects.account_id
        JOIN spike_principals AS principal ON principal.id=membership.principal_id
        WHERE item_image_objects.account_id=subscription.parameter('account_id')
        AND item_image_objects.id IN (
          SELECT receipt.attachment_id FROM ledger_private.expense_receipt_attachments AS receipt
          JOIN ledger_private.expenses AS expense ON expense.account_id=receipt.account_id AND expense.id=receipt.expense_id
          WHERE receipt.account_id=subscription.parameter('account_id')
          AND expense.project_id=subscription.parameter('project_id'))
        AND principal.auth_user_id=auth.user_id()
        AND membership.state='active' AND membership.financial_access='full'

  project_invoicing_item_charges:
    auto_subscribe: false
    queries:
      - |
        SELECT item_charge_occurrences.id, item_charge_occurrences.account_id, item_charge_occurrences.project_id,
          item_charge_occurrences.item_id, item_charge_occurrences.placement_id, item_charge_occurrences.category_id,
          item_charge_occurrences.amount_minor_units::text AS amount_minor_units, item_charge_occurrences.currency,
          item_charge_occurrences.revision, item_charge_occurrences.withdrawn_at
        FROM ledger_private.item_charge_occurrences
        JOIN spike_account_memberships AS membership ON membership.account_id = item_charge_occurrences.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE item_charge_occurrences.account_id = subscription.parameter('account_id')
        AND item_charge_occurrences.project_id = subscription.parameter('project_id')
        AND item_charge_occurrences.withdrawn_at IS NULL
        AND principal.auth_user_id = auth.user_id()
        AND membership.state = 'active' AND membership.financial_access = 'full'
      - |
        SELECT collected_invoice_lines.id, collected_invoice_lines.account_id, collected_invoice_lines.invoice_id,
          collected_invoice_lines.source_kind, collected_invoice_lines.source_id, collected_invoice_lines.item_id,
          collected_invoice_lines.source_revision::text AS source_revision, collected_invoice_lines.category_id,
          collected_invoice_lines.signed_amount_minor_units::text AS signed_amount_minor_units, collected_invoice_lines.currency,
          collected_invoice_lines.line_position, collected_invoice_lines.description,
          collected_invoice_lines.source_snapshot::text AS source_snapshot_json
        FROM ledger_private.collected_invoice_lines
        JOIN spike_account_memberships AS membership ON membership.account_id = collected_invoice_lines.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE collected_invoice_lines.account_id = subscription.parameter('account_id')
        AND collected_invoice_lines.source_kind = 'item'
        AND collected_invoice_lines.sync_project_id = subscription.parameter('project_id')
        AND principal.auth_user_id = auth.user_id()
        AND membership.state = 'active' AND membership.financial_access = 'full'
      - |
        SELECT collected_invoices.id, collected_invoices.account_id, collected_invoices.project_id,
          collected_invoices.client_id, collected_invoices.sealed, collected_invoices.purchase_id,
          collected_invoices.invoice_revision::text AS invoice_revision, collected_invoices.currency,
          collected_invoices.total_minor_units::text AS total_minor_units,
          collected_invoices.display_metadata::text AS display_metadata
        FROM ledger_private.collected_invoices
        JOIN spike_account_memberships AS membership ON membership.account_id = collected_invoices.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE collected_invoices.account_id = subscription.parameter('account_id')
        AND collected_invoices.project_id = subscription.parameter('project_id') AND collected_invoices.sealed = true
        AND principal.auth_user_id = auth.user_id()
        AND membership.state = 'active' AND membership.financial_access = 'full'
      - |
        SELECT spike_budget_categories.id, spike_budget_categories.account_id, spike_budget_categories.display_name,
          spike_budget_categories.kind, spike_budget_categories.lifecycle, spike_budget_categories.is_system,
          spike_budget_categories.excludes_from_overall_budget, spike_budget_categories.visibility_class,
          spike_budget_categories.presentation_order, spike_budget_categories.revision,
          spike_budget_categories.created_at_ms, spike_budget_categories.updated_at_ms
        FROM spike_budget_categories
        JOIN spike_account_memberships AS membership ON membership.account_id = spike_budget_categories.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE spike_budget_categories.account_id = subscription.parameter('account_id')
        AND spike_budget_categories.id IN (
          SELECT charge.category_id FROM ledger_private.item_charge_occurrences AS charge
          WHERE charge.account_id = subscription.parameter('account_id')
          AND charge.project_id = subscription.parameter('project_id') AND charge.withdrawn_at IS NULL
        )
        AND principal.auth_user_id = auth.user_id()
        AND membership.state = 'active' AND membership.financial_access = 'full'

  transaction_receipts:
    auto_subscribe: false
    priority: 3
    queries:
      # Scope-wide payment history is not limited to currently placed Items.
      # Match the Item-linked projection above for overlapping subscriptions.
      - |
        SELECT spike_transactions.id, spike_transactions.account_id, spike_transactions.project_id,
          spike_transactions.client_id, spike_transactions.type, spike_transactions.role,
          spike_transactions.amount_minor_units::text AS amount_minor_units,
          spike_transactions.currency, spike_transactions.origin, spike_transactions.scope_kind,
          spike_transactions.source, spike_transactions.transaction_date::text AS transaction_date,
          spike_transactions.created_at_ms::text AS created_at_ms, spike_transactions.notes,
          spike_transactions.payment_method, spike_transactions.has_email_receipt,
          spike_transactions.legacy_subtotal_minor_units::text AS legacy_subtotal_minor_units,
          spike_transactions.legacy_tax_rate_pct::text AS legacy_tax_rate_pct
        FROM spike_transactions
        JOIN spike_account_memberships AS membership ON membership.account_id = spike_transactions.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE spike_transactions.account_id = subscription.parameter('account_id')
          AND spike_transactions.origin = 'firebase_client_payment'
          AND membership.account_id = subscription.parameter('account_id')
          AND subscription.parameter('scope_kind') = 'project'
          AND spike_transactions.scope_kind = 'project'
          AND spike_transactions.project_id = subscription.parameter('project_id')
          AND principal.auth_user_id = auth.user_id() AND membership.state = 'active'
          AND membership.financial_access = 'full'
      - |
        SELECT spike_transactions.id, spike_transactions.account_id, spike_transactions.project_id,
          spike_transactions.client_id, spike_transactions.type, spike_transactions.role,
          spike_transactions.amount_minor_units::text AS amount_minor_units,
          spike_transactions.currency, spike_transactions.origin, spike_transactions.scope_kind,
          spike_transactions.category_id, spike_transactions.non_item_receipt_lines,
          spike_transactions.source, spike_transactions.transaction_date::text AS transaction_date,
          spike_transactions.created_at_ms::text AS created_at_ms, spike_transactions.notes,
          spike_transactions.payment_method, spike_transactions.has_email_receipt,
          spike_transactions.legacy_subtotal_minor_units::text AS legacy_subtotal_minor_units,
          spike_transactions.legacy_tax_rate_pct::text AS legacy_tax_rate_pct
        FROM spike_transactions
        JOIN spike_budget_categories AS category ON category.account_id = spike_transactions.account_id
          AND category.id = spike_transactions.category_id
          AND category.account_id = subscription.parameter('account_id')
        JOIN spike_account_memberships AS membership ON membership.account_id = spike_transactions.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE spike_transactions.account_id = subscription.parameter('account_id')
          AND spike_transactions.origin = 'vendor_payment'
          AND membership.account_id = subscription.parameter('account_id')
          AND spike_transactions.scope_kind = subscription.parameter('scope_kind')
          AND ifnull(spike_transactions.project_id,'')=ifnull(subscription.parameter('project_id'),'')
          AND principal.auth_user_id = auth.user_id() AND membership.state = 'active'
          AND (category.visibility_class='ordinary' OR membership.financial_access='full')
      - |
        SELECT transaction_attachment_sets.id,transaction_attachment_sets.account_id,
          transaction_attachment_sets.transaction_id,transaction_attachment_sets.section,
          transaction_attachment_sets.revision::text AS revision,transaction_attachment_sets.expected_count
        FROM transaction_attachment_sets
        JOIN spike_account_memberships AS membership ON membership.account_id=transaction_attachment_sets.account_id
        JOIN spike_principals AS principal ON principal.id=membership.principal_id
        WHERE transaction_attachment_sets.account_id=subscription.parameter('account_id')
          AND transaction_attachment_sets.sync_scope_kind=subscription.parameter('scope_kind')
          AND ifnull(transaction_attachment_sets.sync_project_id,'')=ifnull(subscription.parameter('project_id'),'')
          AND principal.auth_user_id=auth.user_id() AND membership.state='active' AND membership.financial_access='full'
      - |
        SELECT transaction_attachment_references.id,transaction_attachment_references.account_id,
          transaction_attachment_references.transaction_id,transaction_attachment_references.section,
          transaction_attachment_references.attachment_id,transaction_attachment_references.set_revision::text AS set_revision,
          transaction_attachment_references.position,transaction_attachment_references.is_primary,transaction_attachment_references.file_name,
          transaction_attachment_references.sync_content_sha256 AS content_sha256,
          transaction_attachment_references.sync_byte_count::text AS byte_count,
          transaction_attachment_references.sync_media_type AS media_type,transaction_attachment_references.sync_storage_path AS storage_path
        FROM transaction_attachment_references
        JOIN spike_account_memberships AS membership ON membership.account_id=transaction_attachment_references.account_id
        JOIN spike_principals AS principal ON principal.id=membership.principal_id
        WHERE transaction_attachment_references.account_id=subscription.parameter('account_id')
          AND transaction_attachment_references.sync_scope_kind=subscription.parameter('scope_kind')
          AND ifnull(transaction_attachment_references.sync_project_id,'')=ifnull(subscription.parameter('project_id'),'')
          AND transaction_attachment_references.sync_is_current=true
          AND principal.auth_user_id=auth.user_id() AND membership.state='active' AND membership.financial_access='full'
      # Restricted readers get ordinary vendor records only. Full access above
      # needs no category lookup; keep these permission branches disjoint to
      # avoid multiplying dynamic parameters for every category of a full member.
      - |
        SELECT transaction_attachment_sets.id,transaction_attachment_sets.account_id,
          transaction_attachment_sets.transaction_id,transaction_attachment_sets.section,
          transaction_attachment_sets.revision::text AS revision,transaction_attachment_sets.expected_count
        FROM transaction_attachment_sets
        JOIN spike_budget_categories AS category ON category.account_id=transaction_attachment_sets.account_id
          AND category.id=transaction_attachment_sets.sync_category_id AND category.account_id=subscription.parameter('account_id')
        JOIN spike_account_memberships AS membership ON membership.account_id=transaction_attachment_sets.account_id
        JOIN spike_principals AS principal ON principal.id=membership.principal_id
        WHERE transaction_attachment_sets.account_id=subscription.parameter('account_id')
          AND membership.account_id=subscription.parameter('account_id')
          AND transaction_attachment_sets.sync_scope_kind=subscription.parameter('scope_kind')
          AND ifnull(transaction_attachment_sets.sync_project_id,'')=ifnull(subscription.parameter('project_id'),'')
          AND principal.auth_user_id=auth.user_id() AND membership.state='active'
          AND category.visibility_class='ordinary' AND membership.financial_access<>'full'
      - |
        SELECT transaction_attachment_references.id,transaction_attachment_references.account_id,
          transaction_attachment_references.transaction_id,transaction_attachment_references.section,
          transaction_attachment_references.attachment_id,transaction_attachment_references.set_revision::text AS set_revision,
          transaction_attachment_references.position,transaction_attachment_references.is_primary,transaction_attachment_references.file_name,
          transaction_attachment_references.sync_content_sha256 AS content_sha256,
          transaction_attachment_references.sync_byte_count::text AS byte_count,
          transaction_attachment_references.sync_media_type AS media_type,transaction_attachment_references.sync_storage_path AS storage_path
        FROM transaction_attachment_references
        JOIN spike_budget_categories AS category ON category.account_id=transaction_attachment_references.account_id
          AND category.id=transaction_attachment_references.sync_category_id AND category.account_id=subscription.parameter('account_id')
        JOIN spike_account_memberships AS membership ON membership.account_id=transaction_attachment_references.account_id
        JOIN spike_principals AS principal ON principal.id=membership.principal_id
        WHERE transaction_attachment_references.account_id=subscription.parameter('account_id')
          AND membership.account_id=subscription.parameter('account_id')
          AND transaction_attachment_references.sync_scope_kind=subscription.parameter('scope_kind')
          AND ifnull(transaction_attachment_references.sync_project_id,'')=ifnull(subscription.parameter('project_id'),'')
          AND transaction_attachment_references.sync_is_current=true
          AND principal.auth_user_id=auth.user_id() AND membership.state='active'
          AND category.visibility_class='ordinary' AND membership.financial_access<>'full'
      - |
        SELECT transaction_receipt_items.id, transaction_receipt_items.account_id,
          transaction_receipt_items.transaction_id, transaction_receipt_items.item_id,
          transaction_receipt_items.currency, transaction_receipt_items.amount_minor_units::text AS amount_minor_units,
          transaction_receipt_items.membership_kind
        FROM transaction_receipt_items
        JOIN spike_budget_categories AS category ON category.account_id = transaction_receipt_items.account_id
          AND category.id = transaction_receipt_items.sync_category_id
          AND category.account_id=subscription.parameter('account_id')
        JOIN spike_account_memberships AS membership ON membership.account_id = transaction_receipt_items.account_id
          AND membership.account_id=subscription.parameter('account_id')
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE transaction_receipt_items.account_id = subscription.parameter('account_id')
          AND transaction_receipt_items.sync_scope_kind = subscription.parameter('scope_kind')
          AND ifnull(transaction_receipt_items.sync_project_id,'')=ifnull(subscription.parameter('project_id'),'')
          AND principal.auth_user_id = auth.user_id() AND membership.state = 'active'
          AND (category.visibility_class='ordinary' OR membership.financial_access='full')
      - |
        SELECT spike_budget_categories.*
        FROM spike_budget_categories
        JOIN spike_account_memberships AS membership ON membership.account_id = spike_budget_categories.account_id
        JOIN spike_principals AS principal ON principal.id = membership.principal_id
        WHERE spike_budget_categories.account_id = subscription.parameter('account_id')
          AND principal.auth_user_id = auth.user_id() AND membership.state = 'active'
          AND membership.account_id = subscription.parameter('account_id')
          AND (spike_budget_categories.visibility_class='ordinary' OR membership.financial_access='full')
      - |
        SELECT spike_account_memberships.*
        FROM spike_account_memberships
        WHERE spike_account_memberships.account_id = subscription.parameter('account_id')
          AND spike_account_memberships.state = 'active'
          AND spike_account_memberships.principal_id IN (
            SELECT principal.id FROM spike_principals AS principal WHERE principal.auth_user_id = auth.user_id()
          )

      # Physical metadata already has Account-member authorization. Use that
      # existing scope directly instead of creating a bucket for every receipt
      # Item. Financial relationships below remain independently restricted.
      - |
        SELECT spike_items.id, spike_items.account_id, spike_items.name, spike_items.description, spike_items.sku,
          spike_items.workflow_status, spike_items.bookmark,
          spike_items.source, spike_items.current_source, spike_items.notes,
          spike_items.market_value_minor_units::text AS market_value_minor_units, spike_items.market_value_currency, spike_items.revision,
          spike_items.created_at, spike_items.created_by_principal_id
        FROM spike_items
        WHERE spike_items.account_id=subscription.parameter('account_id') AND spike_items.account_id IN (
          SELECT membership.account_id FROM spike_account_memberships AS membership
          JOIN spike_principals AS principal ON principal.id=membership.principal_id
          WHERE membership.account_id=subscription.parameter('account_id')
            AND principal.auth_user_id=auth.user_id() AND membership.state='active')

      # Existing image-set markers choose a group thumbnail without fetching
      # every Item's media. Bytes remain under the Item-image subscription.
      - |
        SELECT item_image_sets.id,item_image_sets.account_id,item_image_sets.item_id,
          item_image_sets.revision::text AS revision,item_image_sets.expected_count
        FROM item_image_sets
        WHERE item_image_sets.account_id=subscription.parameter('account_id') AND item_image_sets.account_id IN (
          SELECT membership.account_id FROM spike_account_memberships AS membership
          JOIN spike_principals AS principal ON principal.id=membership.principal_id
          WHERE membership.account_id=subscription.parameter('account_id')
            AND principal.auth_user_id=auth.user_id() AND membership.state='active')
      - |
        SELECT spike_spaces.id, spike_spaces.account_id, spike_spaces.scope_kind, spike_spaces.project_id,
          spike_spaces.display_name, spike_spaces.lifecycle, spike_spaces.revision
        FROM spike_spaces
        WHERE spike_spaces.account_id=subscription.parameter('account_id')
          AND (spike_spaces.lifecycle='active' OR spike_spaces.sync_current_item_count > 0)
          AND spike_spaces.account_id IN (
            SELECT membership.account_id FROM spike_account_memberships AS membership
            JOIN spike_principals AS principal ON principal.id=membership.principal_id
            WHERE membership.account_id=subscription.parameter('account_id')
              AND principal.auth_user_id=auth.user_id() AND membership.state='active')

      # Current placements include historical receipt/payment Items now elsewhere.
      # Item-category history is authorized by category; the local current-only
      # query still joins active placements, rather than using a bucket per Item.
      - |
        SELECT spike_item_placements.id, spike_item_placements.account_id, spike_item_placements.item_id, spike_item_placements.scope_kind,
          spike_item_placements.project_id, spike_item_placements.space_id, spike_item_placements.started_at, spike_item_placements.start_evidence,
          spike_item_placements.started_by_principal_id, spike_item_placements.ended_at, spike_item_placements.ended_by_principal_id
        FROM spike_item_placements
        WHERE spike_item_placements.account_id=subscription.parameter('account_id')
          AND spike_item_placements.ended_at IS NULL
          AND spike_item_placements.account_id IN (
            SELECT membership.account_id FROM spike_account_memberships AS membership
            JOIN spike_principals AS principal ON principal.id=membership.principal_id
            WHERE membership.account_id=subscription.parameter('account_id')
              AND principal.auth_user_id=auth.user_id() AND membership.state='active')
      - |
        SELECT spike_item_project_categories.id, spike_item_project_categories.account_id,
          spike_item_project_categories.project_id, spike_item_project_categories.item_id,
          spike_item_project_categories.category_id, spike_item_project_categories.revision
        FROM spike_item_project_categories
        JOIN spike_budget_categories AS category ON category.account_id=spike_item_project_categories.account_id
          AND category.id=spike_item_project_categories.category_id
          AND category.account_id=subscription.parameter('account_id')
        JOIN spike_account_memberships AS membership ON membership.account_id=spike_item_project_categories.account_id
        JOIN spike_principals AS principal ON principal.id=membership.principal_id
        WHERE subscription.parameter('scope_kind')='project'
          AND spike_item_project_categories.account_id=subscription.parameter('account_id')
          AND spike_item_project_categories.project_id=subscription.parameter('project_id')
          AND membership.account_id=subscription.parameter('account_id')
          AND principal.auth_user_id=auth.user_id() AND membership.state='active'
          AND (category.visibility_class='ordinary' OR membership.financial_access='full')
      - |
        SELECT item_client_payment_connections.id, item_client_payment_connections.account_id,
          item_client_payment_connections.project_id, item_client_payment_connections.client_id,
          item_client_payment_connections.item_id, item_client_payment_connections.placement_id,
          item_client_payment_connections.transaction_id, 'purchase' AS transaction_type,
          'standalone' AS transaction_role, item_client_payment_connections.ended_at
        FROM ledger_private.item_client_payment_connections
        JOIN spike_account_memberships AS membership ON membership.account_id=item_client_payment_connections.account_id
        JOIN spike_principals AS principal ON principal.id=membership.principal_id
        WHERE subscription.parameter('scope_kind')='project'
          AND item_client_payment_connections.account_id=subscription.parameter('account_id')
          AND item_client_payment_connections.project_id=subscription.parameter('project_id')
          AND membership.account_id=subscription.parameter('account_id')
          AND principal.auth_user_id=auth.user_id()
          AND membership.state='active' AND membership.financial_access='full'
      # The connection's exact Account/Item/Project placement FK and the
      # placement scope CHECK already prove its Project parent. Rejoining every
      # placement here adds per-Item buckets without strengthening authorization.

      # Full sealed contents, including departed Items, Expenses and Fee lines.
      # Same row projection as report subscriptions; history is not current placement.
      - |
        SELECT collected_invoices.id, collected_invoices.account_id, collected_invoices.project_id,
          collected_invoices.client_id, collected_invoices.sealed, collected_invoices.purchase_id,
          collected_invoices.invoice_revision::text AS invoice_revision, collected_invoices.currency,
          collected_invoices.total_minor_units::text AS total_minor_units,
          collected_invoices.display_metadata::text AS display_metadata
        FROM ledger_private.collected_invoices
        JOIN spike_account_memberships AS membership ON membership.account_id=collected_invoices.account_id
        JOIN spike_principals AS principal ON principal.id=membership.principal_id
        WHERE subscription.parameter('scope_kind')='project'
          AND collected_invoices.account_id=subscription.parameter('account_id')
          AND collected_invoices.project_id=subscription.parameter('project_id') AND collected_invoices.sealed=true
          AND membership.account_id=subscription.parameter('account_id')
          AND principal.auth_user_id=auth.user_id() AND membership.state='active' AND membership.financial_access='full'
      - |
        SELECT collected_invoice_lines.id, collected_invoice_lines.account_id, collected_invoice_lines.invoice_id,
          collected_invoice_lines.source_kind, collected_invoice_lines.source_id, collected_invoice_lines.item_id,
          collected_invoice_lines.source_revision::text AS source_revision, collected_invoice_lines.category_id,
          collected_invoice_lines.signed_amount_minor_units::text AS signed_amount_minor_units, collected_invoice_lines.currency,
          collected_invoice_lines.line_position, collected_invoice_lines.description,
          collected_invoice_lines.source_snapshot::text AS source_snapshot_json
        FROM ledger_private.collected_invoice_lines
        JOIN spike_account_memberships AS membership ON membership.account_id=collected_invoice_lines.account_id
        JOIN spike_principals AS principal ON principal.id=membership.principal_id
        WHERE subscription.parameter('scope_kind')='project'
          AND collected_invoice_lines.account_id=subscription.parameter('account_id')
          AND collected_invoice_lines.sync_project_id=subscription.parameter('project_id')
          AND membership.account_id=subscription.parameter('account_id')
          AND principal.auth_user_id=auth.user_id() AND membership.state='active' AND membership.financial_access='full'
      # Every committed header is sealed by collected_invoice_complete. The
      # immutable line's derived Project removes per-Invoice parameter lookups;
      # source assembly cannot commit and is never a downloadable draft phase.

