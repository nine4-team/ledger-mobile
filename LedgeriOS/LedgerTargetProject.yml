name: LedgerTarget

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"

packages:
  LedgerTargetCore:
    path: .

targets:
  LedgerTargetStaging:
    type: application
    platform: auto
    supportedDestinations:
      - iOS
      - macOS
    sources:
      - path: LedgerTargetApp
    dependencies:
      - package: LedgerTargetCore
        product: LedgerTargetCore
      - package: LedgerTargetCore
        product: LedgerTargetPowerSync
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        CURRENT_PROJECT_VERSION: 1
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ledger STAGING
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: apps.nine4.ledger.staging
        PRODUCT_MODULE_NAME: LedgerTargetStaging
        PRODUCT_NAME: Ledger STAGING
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: 6.0

schemes:
  LedgerTargetStaging:
    build:
      targets:
        LedgerTargetStaging: all
    run:
      config: Debug
    archive:
      config: Release
