name: Supabase conversion control

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conversion-control:
    name: Conversion state and traceability
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate conversion control plane
        run: |
          npm run conversion:check
          npm run conversion:capabilities:check
          npm run conversion:queries:check
          npm run conversion:residuals:check
          npm run conversion:gate:m0

      - name: Confirm checks did not rewrite tracked artifacts
        run: git diff --exit-code

  target-environment:
    name: Isolated target environment
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate target dependency and environment boundaries
        run: |
          node --check scripts/check-target-environment.mjs
          npm run target:environment:check

      - name: Validate generated app and MCP contracts
        run: |
          npm --prefix LedgerTargetMCP ci --ignore-scripts
          npm run target:contracts:check

      - name: Test isolated target contracts
        run: swift test --package-path LedgeriOS

      - name: Build target staging for macOS
        run: npm run target:staging:build:macos

      - name: Build target staging for iOS Simulator
        run: npm run target:staging:build:ios

      - name: Confirm target checks did not rewrite tracked artifacts
        run: git diff --exit-code
